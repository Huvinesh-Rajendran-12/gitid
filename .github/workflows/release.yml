name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gitid
            asset_name: gitid-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: gitid
            asset_name: gitid-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gitid
            asset_name: gitid-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gitid
            asset_name: gitid-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gitid.exe
            asset_name: gitid-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - name: Checkout gitid repo
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          echo "tarball_url=${TARBALL_URL}" >> $GITHUB_OUTPUT
          curl -sL "${TARBALL_URL}" -o "/tmp/${TAG}.tar.gz"
          SHA256=$(shasum -a 256 "/tmp/${TAG}.tar.gz" | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-gitid
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap-repo

      - name: Update formula
        env:
          TARBALL_URL: ${{ steps.release.outputs.tarball_url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          FORMULA_FILE="tap-repo/Formula/gitid.rb"
          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" "${FORMULA_FILE}"
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" "${FORMULA_FILE}"

      - name: Commit and push to tap
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gitid.rb
          git commit -m "Update gitid to ${TAG}" || echo "No changes to commit"
          git push
